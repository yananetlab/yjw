</style></head><body data-kind="meeting" data-mobile-view="preview"><div class="wrap"><nav class="topbar" aria-label="作品导航"><a class="back" href="../index.html">返回作品集</a><span class="chip">可填写 · 可导出Word</span></nav><header class="hero docs-hero"><div><p class="eyebrow">办公小工具</p><h1>会议纪要和通知，<br><span>填完就能带走。</span></h1><p>左边填内容，右边看排版。导出Word后，还能接着改。</p></div><div class="hero-side">不用注册<br>填写内容保存在本机</div></header><div class="doc-types" role="group" aria-label="文档类型"><button class="doc-type" type="button" data-kind="meeting" aria-pressed="true"><span class="type-icon" aria-hidden="true">记</span><span><strong>会议纪要</strong><small>议题、结论、待办跟进</small></span></button><button class="doc-type notice" type="button" data-kind="notice" aria-pressed="false"><span class="type-icon" aria-hidden="true">知</span><span><strong>工作通知</strong><small>范围、要求、时间安排</small></span></button></div><div class="mobile-switch" role="group" aria-label="编辑或预览"><button type="button" data-mobile-view="preview" aria-pressed="true">看预览</button><button type="button" data-mobile-view="edit" aria-pressed="false">填内容</button></div><main class="workspace"><section class="editor" aria-labelledby="editor-title"><div class="editor-head"><h2 id="editor-title">填写内容</h2><div class="mode-switch" role="group" aria-label="示例或自己的草稿"><button type="button" data-mode="example" aria-pressed="true">看示例</button><button type="button" data-mode="mine" aria-pressed="false">自己填</button></div></div><div id="editor-fields"></div></section><section class="preview-pane" aria-labelledby="preview-title"><div class="preview-head"><h2 id="preview-title">排版预览</h2><span id="preview-kind">会议纪要</span></div><article class="paper" id="document-paper"></article><div class="export-bar"><div class="actions"><button class="button primary" type="button" id="export-word"><span class="word-icon" aria-hidden="true">W</span>导出Word</button><button class="button" type="button" id="print-document">打印 / 存为PDF</button></div><small id="save-status">示例可直接修改</small></div><p class="export-status" id="export-status" role="status" aria-live="polite"></p></section></main><p class="app-note">“看示例”里的内容是模拟场景。“自己填”会保留你的本机草稿；两个版本分开保存，切换时不会覆盖。</p><footer class="footer">严珺文的办公作品 · 重要的姓名、时间和数字，导出前再核对一遍。</footer></div><script>(function documentsApp(){
  'use strict';
  const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const lines=value=>esc(value||'________________').replace(/\n/g,'<br>');
  const examples={meeting:{topic:'月度行政协作会议',date:'2026年11月20日',time:'14:00—14:40',location:'会议室A',host:'行政负责人',people:'行政经办人、各部门联络人',agenda:'核对资料归档进度，确认耗材台账补录与会议室预约安排。',decisions:'1. 本月资料按统一目录归档，缺失项目由部门联络人补齐。\n2. 耗材领用当天登记，月底核对领用记录与库存。\n3. 更新会议室预约说明，并发送给各部门。',pending:'个别历史资料的存放位置待核实，由部门联络人于11月24日前反馈。',recorder:'行政经办人',reviewer:'会议主持人',tasks:[{task:'补齐资料归档清单',owner:'部门联络人',due:'11月24日17:00',result:'补齐后的归档清单'},{task:'补录耗材领用记录',owner:'行政经办人',due:'11月25日17:00',result:'更新后的领用台账'},{task:'更新会议室预约说明',owner:'行政经办人',due:'11月26日12:00',result:'预约说明及发送记录'}]},notice:{title:'关于开展办公资料月度归档的通知',recipient:'各部门：',opening:'为便于资料检索与后续核对，现开展本月办公资料归档，有关安排如下。',scope:'本月形成的会议纪要、通知、业务登记表及需要留存的活动资料。已归档且无更新的资料不重复提交。',requirements:'请按“部门_资料名称_日期_版本”命名文件，核对资料是否完整、版本是否正确。待确认的问题请另附清单。',deadline:'请于2026年11月27日17:00前，提交至部门共享目录中的“行政归档/本月资料”文件夹。',contact:'如有资料缺失或时间调整，请提前联系行政经办人说明情况。',issuer:'行政办公室',issuedate:'2026年11月23日'}};
  const copy=value=>JSON.parse(JSON.stringify(value));
  const blank=kind=>Object.fromEntries(Object.keys(examples[kind]).map(key=>[key,key==='tasks'?[{task:'',owner:'',due:'',result:''}]: '']));
  let drafts={meeting:{example:copy(examples.meeting),mine:blank('meeting')},notice:{example:copy(examples.notice),mine:blank('notice')}},kind='meeting',mode='example';
  try{const saved=JSON.parse(localStorage.getItem('yjw-documents-v2'));if(saved&&saved.meeting&&saved.notice&&saved.meeting.mine&&Array.isArray(saved.meeting.mine.tasks))drafts=saved;}catch(error){}
  const data=()=>drafts[kind][mode];
  function save(){try{localStorage.setItem('yjw-documents-v2',JSON.stringify(drafts));document.getElementById('save-status').textContent='已保存到本机';}catch(error){document.getElementById('save-status').textContent='本次填写已保留';}}
  function field(key,label,multiline=false,wide=false){const value=data()[key]||'';return '<label class="form-field '+(wide?'wide':'')+'"><span>'+label+'</span>'+(multiline?'<textarea rows="3" data-field="'+key+'" placeholder="填写'+label+'">'+esc(value)+'</textarea>':'<input type="text" data-field="'+key+'" value="'+esc(value)+'" placeholder="填写'+label+'">')+'</label>';}
  function renderEditor(){
    const d=data();let html='';
    if(kind==='meeting'){
      html='<div class="form-grid">'+field('topic','会议主题',false,true)+field('date','日期')+field('time','时间')+field('location','地点')+field('host','主持人')+field('people','参会人员',true,true)+'</div><h3>会议内容</h3>'+field('agenda','议题',true)+field('decisions','已确认事项',true)+field('pending','待确认问题',true)+'<div class="section-title"><h3>待办事项</h3><button class="text-button" id="add-task" type="button">添加一项</button></div><div class="task-list">';
      d.tasks.forEach((task,i)=>{html+='<div class="task-editor"><div class="task-heading"><span>待办 '+(i+1)+'</span><button class="text-button remove-task" type="button" data-remove="'+i+'" aria-label="删除第'+(i+1)+'项待办">删除</button></div><div class="form-grid">'+[['task','事项'],['owner','负责人'],['due','截止时间'],['result','交付物']].map(([key,label])=>'<label class="form-field"><span>'+label+'</span><input type="text" data-task="'+i+'" data-key="'+key+'" value="'+esc(task[key]||'')+'" placeholder="填写'+label+'"></label>').join('')+'</div></div>';});
      html+='</div><h3>记录与复核</h3><div class="form-grid">'+field('recorder','记录人')+field('reviewer','复核人')+'</div>';
    }else html=field('title','通知标题',true)+field('recipient','发送对象')+field('opening','通知事由',true)+field('scope','工作范围',true)+field('requirements','办理要求',true)+field('deadline','时间与提交方式',true)+field('contact','联系与反馈',true)+'<div class="form-grid">'+field('issuer','发出部门')+field('issuedate','发出日期')+'</div>';
    document.getElementById('editor-fields').innerHTML=html;
  }
  function renderPreview(){const d=data();let html='';
    if(kind==='meeting')html='<h2>会议纪要</h2><dl class="doc-meta">'+[['topic','会议主题'],['date','日期'],['time','时间'],['location','地点'],['host','主持人'],['people','参会人员']].map(([key,label])=>'<div><dt>'+label+'</dt><dd>'+lines(d[key])+'</dd></div>').join('')+'</dl><h3>会议议题</h3><p>'+lines(d.agenda)+'</p><h3>已确认事项</h3><p>'+lines(d.decisions)+'</p><h3>待办事项</h3><table><thead><tr><th>事项</th><th>负责人</th><th>截止时间</th><th>交付物</th></tr></thead><tbody>'+d.tasks.map(task=>'<tr>'+['task','owner','due','result'].map(key=>'<td>'+lines(task[key])+'</td>').join('')+'</tr>').join('')+'</tbody></table><h3>待确认问题</h3><p>'+lines(d.pending)+'</p><div class="doc-signatures"><p>记录：'+lines(d.recorder)+'</p><p>复核：'+lines(d.reviewer)+'</p></div>';
    else html='<h2>'+lines(d.title||'工作通知')+'</h2><p>'+lines(d.recipient)+'</p><p>'+lines(d.opening)+'</p><h3>一、工作范围</h3><p>'+lines(d.scope)+'</p><h3>二、办理要求</h3><p>'+lines(d.requirements)+'</p><h3>三、时间与提交方式</h3><p>'+lines(d.deadline)+'</p><p>'+lines(d.contact)+'</p><div class="notice-signature"><p>'+lines(d.issuer)+'</p><p>'+lines(d.issuedate)+'</p></div>';
    if(mode==='example')html+='<p class="doc-example">行政办公模拟示例，不对应真实公司、人员或会议。</p>';
    document.getElementById('document-paper').innerHTML=html;
    document.getElementById('preview-kind').textContent=kind==='meeting'?'会议纪要':'工作通知';
  }
  function render(){document.querySelectorAll('[data-kind]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.kind===kind)));document.querySelectorAll('[data-mode]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.mode===mode)));document.body.dataset.kind=kind;renderEditor();renderPreview();}
  document.getElementById('editor-fields').addEventListener('input',event=>{const el=event.target;if(el.dataset.field)data()[el.dataset.field]=el.value;else if(el.dataset.task!==undefined)data().tasks[Number(el.dataset.task)][el.dataset.key]=el.value;else return;renderPreview();save();});
  document.getElementById('editor-fields').addEventListener('click',event=>{const add=event.target.closest('#add-task'),remove=event.target.closest('[data-remove]');if(add){data().tasks.push({task:'',owner:'',due:'',result:''});renderEditor();renderPreview();save();}else if(remove){data().tasks.splice(Number(remove.dataset.remove),1);renderEditor();renderPreview();save();}});
  document.querySelectorAll('[data-kind]').forEach(button=>button.addEventListener('click',()=>{kind=button.dataset.kind;render();}));document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>{mode=button.dataset.mode;render();}));
  document.querySelectorAll('[data-mobile-view]').forEach(button=>button.addEventListener('click',()=>{document.body.dataset.mobileView=button.dataset.mobileView;document.querySelectorAll('[data-mobile-view]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));
  document.getElementById('print-document').addEventListener('click',()=>window.print());
  // 构造真正的.docx：OOXML文档与ZIP容器，离线可用，不把HTML改后缀冒充Word文件。
  function xml(value){return String(value??'').replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
  function run(text,bold=false,size){const props=(bold?'<w:b/>':'')+(size?'<w:sz w:val="'+size+'"/>':'');return '<w:r>'+(props?'<w:rPr>'+props+'</w:rPr>':'')+String(text||'________________').split('\n').map((line,i)=>(i?'<w:br/>':'')+'<w:t xml:space="preserve">'+xml(line)+'</w:t>').join('')+'</w:r>';}
  function paragraph(text,options={}){return '<w:p><w:pPr>'+(options.title?'<w:pStyle w:val="Title"/><w:jc w:val="center"/>':options.heading?'<w:pStyle w:val="Heading1"/><w:keepNext/>':'')+(options.right?'<w:jc w:val="right"/>':'')+'</w:pPr>'+run(text,!!options.heading,options.small?17:undefined)+'</w:p>';}
  function wordTable(rows){const widths=[3000,1600,2100,3286];return '<w:tbl><w:tblPr><w:tblW w:w="9986" w:type="dxa"/><w:tblLayout w:type="fixed"/><w:tblBorders>'+['top','left','bottom','right','insideH','insideV'].map(side=>'<w:'+side+' w:val="single" w:sz="4" w:color="D9D9D9"/>').join('')+'</w:tblBorders><w:tblCellMar><w:top w:w="80" w:type="dxa"/><w:left w:w="90" w:type="dxa"/><w:bottom w:w="80" w:type="dxa"/><w:right w:w="90" w:type="dxa"/></w:tblCellMar></w:tblPr><w:tblGrid>'+widths.map(w=>'<w:gridCol w:w="'+w+'"/>').join('')+'</w:tblGrid>'+rows.map((row,r)=>'<w:tr><w:trPr><w:cantSplit/>'+(r===0?'<w:tblHeader/>':'')+'</w:trPr>'+row.map((cell,c)=>'<w:tc><w:tcPr><w:tcW w:w="'+widths[c]+'" w:type="dxa"/><w:vAlign w:val="center"/>'+(r===0?'<w:shd w:fill="EAF0F9"/>':'')+'</w:tcPr><w:p><w:pPr><w:spacing w:after="0" w:line="290" w:lineRule="auto"/></w:pPr>'+run(cell,r===0,20)+'</w:p></w:tc>').join('')+'</w:tr>').join('')+'</w:tbl>';}
  function zip(files){

    const end=new Uint8Array(22),e=new DataView(end.buffer);e.setUint32(0,0x06054b50,true);e.setUint16(8,central.length,true);e.setUint16(10,central.length,true);e.setUint32(12,centralSize,true);e.setUint32(16,offset,true);return new Blob([...chunks,...central,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
  }
  function exportWord(){const d=data();let body='';
    if(kind==='meeting'){body=paragraph('会议纪要',{title:true})+[['topic','会议主题'],['date','日期'],['time','时间'],['location','地点'],['host','主持人'],['people','参会人员']].map(([key,label])=>paragraph(label+'：'+(d[key]||'________________'))).join('')+paragraph('会议议题',{heading:true})+paragraph(d.agenda)+paragraph('已确认事项',{heading:true})+paragraph(d.decisions)+paragraph('待办事项',{heading:true})+wordTable([['事项','负责人','截止时间','交付物'],...d.tasks.map(task=>[task.task,task.owner,task.due,task.result])])+paragraph('待确认问题',{heading:true})+paragraph(d.pending)+paragraph('记录：'+(d.recorder||'________________')+'    复核：'+(d.reviewer||'________________'));}
    else body=paragraph(d.title||'工作通知',{title:true})+paragraph(d.recipient)+paragraph(d.opening)+paragraph('一、工作范围',{heading:true})+paragraph(d.scope)+paragraph('二、办理要求',{heading:true})+paragraph(d.requirements)+paragraph('三、时间与提交方式',{heading:true})+paragraph(d.deadline)+paragraph(d.contact)+paragraph(d.issuer,{right:true})+paragraph(d.issuedate,{right:true});
    if(mode==='example')body+=paragraph('行政办公模拟示例，不对应真实公司、人员或会议。',{small:true});
    const prefix='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
    const documentXml=prefix+'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="960" w:right="960" w:bottom="960" w:left="960" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr></w:body></w:document>';
    const styles=prefix+'<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="宋体"/><w:sz w:val="22"/><w:lang w:eastAsia="zh-CN"/></w:rPr></w:rPrDefault><w:pPrDefault><w:pPr><w:autoSpaceDE w:val="0"/><w:autoSpaceDN w:val="0"/><w:spacing w:after="100" w:line="300" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults><w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/></w:style><w:style w:type="paragraph" w:styleId="Title"><w:name w:val="Title"/><w:basedOn w:val="Normal"/><w:pPr><w:spacing w:after="260"/></w:pPr><w:rPr><w:rFonts w:eastAsia="Microsoft YaHei"/><w:b/><w:color w:val="000000"/><w:sz w:val="38"/></w:rPr></w:style><w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/><w:basedOn w:val="Normal"/><w:pPr><w:keepNext/><w:spacing w:before="150" w:after="80"/></w:pPr><w:rPr><w:b/><w:color w:val="000000"/><w:sz w:val="25"/></w:rPr></w:style></w:styles>';
    const files={'[Content_Types].xml':prefix+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>','_rels/.rels':prefix+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>','word/document.xml':documentXml,'word/styles.xml':styles,'word/_rels/document.xml.rels':prefix+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'};
    const url=URL.createObjectURL(zip(files)),link=document.createElement('a');link.href=url;link.download=(kind==='meeting'?'会议纪要':'工作通知')+(mode==='example'?'示例':'')+'.docx';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);document.getElementById('export-status').textContent='Word文件已生成，下载后可以继续编辑。';
  }
  document.getElementById('export-word').addEventListener('click',()=>{try{exportWord();}catch(error){document.getElementById('export-status').textContent='导出没有完成，请重试。';console.error(error);}});
  render();
})();</script></body></html>
